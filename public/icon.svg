<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b26" />
      <stop offset="100%" stop-color="#0b0d13" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="8"/>
  
  <!-- Film Reel / Clapperboard Icon -->
  <g transform="translate(106, 106) scale(0.5859)">
    <!-- Clapper top stick -->
    <path d="M 64 120 L 448 120 L 448 180 L 64 180 Z" fill="url(#goldGrad)" rx="12"/>
    <path d="M 120 120 L 160 180 M 200 120 L 240 180 M 280 120 L 320 180 M 360 120 L 400 180" stroke="#0b0d13" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Clapper Body -->
    <rect x="64" y="196" width="384" height="240" rx="20" fill="#1e2230" stroke="#333a4d" stroke-width="8"/>
    
    <!-- Play symbol in center -->
    <polygon points="230,266 230,366 320,316" fill="url(#goldGrad)"/>
    
    <!-- Accent lines -->
    <rect x="96" y="228" width="160" height="12" rx="6" fill="#fbbf24" fill-opacity="0.4"/>
    <rect x="96" y="252" width="90" height="10" rx="5" fill="#94a3b8" fill-opacity="0.4"/>
  </g>
</svg>
